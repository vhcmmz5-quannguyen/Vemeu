<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vnEdu Pro - Auto Recovery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-frame">
    <div class="header">
        <h1>vnEdu</h1>
        <div id="user-header" style="display:none;">
            <img src="" id="current-user-img" class="main-avatar">
            <h2 id="current-user-name"></h2>
            <p id="display-role-name"></p>
        </div>
    </div>

    <div class="content">
        <div id="login-section">
            <div style="text-align: center; margin-bottom: 10px;">
                <p style="color: #888; font-size: 14px;">Cổng thông tin điện tử</p>
            </div>
            <input type="text" id="user" placeholder="👤 Tên đăng nhập">
            <input type="password" id="pass" placeholder="🔒 Mật khẩu">
            <button class="login-btn" onclick="handleLogin()">ĐĂNG NHẬP</button>
        </div>

        <div id="home-page" style="display: none;">
            <div id="admin-controls" style="display: none;">
                <div class="form-box">
                    <h4>+ Thêm thành viên mới</h4>
                    <input type="text" id="new-username" class="compact-input" placeholder="Tên tài khoản">
                    <input type="text" id="new-password" class="compact-input" placeholder="Mật khẩu">
                    <div style="display: flex; gap: 8px;">
                        <select id="new-user-role" class="compact-input" style="flex: 1; margin:0;" onchange="toggleChildInput()">
                            <option value="student">Học sinh</option>
                            <option value="parent">Phụ huynh</option>
                            <option value="admin">Quản trị viên</option>
                        </select>
                        <input type="text" id="child-link" class="compact-input" style="flex: 1; margin:0; display:none;" placeholder="User con">
                    </div>
                    <button class="add-btn" style="margin-top:10px" onclick="createUser()">LƯU TÀI KHOẢN</button>
                </div>

                <div id="quick-score-panel" class="form-box" style="display:none; border: 2px solid #ffcc00;">
                    <h4 id="score-target-name">Chấm điểm</h4>
                    <input type="number" id="score-val" class="compact-input" placeholder="Số điểm (+ hoặc -)">
                    <input type="text" id="score-reason" class="compact-input" placeholder="Lý do">
                    <button class="add-btn" style="background:#ffcc00;" onclick="submitScore()">XÁC NHẬN</button>
                </div>
                <div id="user-list"></div>
            </div>

            <div id="view-section" style="display: none;">
                <div class="score-card">
                    <div class="score-main">
                        <span id="st-score-num">0</span>
                        <p id="score-label">ĐIỂM HÀNH KIỂM</p>
                    </div>
                    <div class="score-history">
                        <h4 id="history-label">Nhật ký rèn luyện</h4>
                        <div id="st-history-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="calendar-page" style="display: none; text-align: center;">
            <div class="timetable-container" onclick="triggerScheduleUpload()">
                <img src="https://via.placeholder.com/300x400?text=Chưa+có+lịch" id="img-timetable">
            </div>
            <input type="file" id="upload-timetable" hidden accept="image/*" onchange="uploadSchedule(this)">
        </div>
    </div>

    <div id="nav-bar" class="nav-bar" style="display: none;">
        <div class="nav-item active" onclick="switchPage('home', this)">🏠<span>Quản lý</span></div>
        <div class="nav-item" onclick="switchPage('calendar', this)">📅<span>Lịch học</span></div>
        <div class="nav-item" onclick="handleLogout()">🚪<span>Thoát</span></div>
    </div>
</div>

<input type="file" id="admin-change-avatar" hidden onchange="applyNewAvatar(this)">
<script src="script.js"></script>
</body>
</html>
